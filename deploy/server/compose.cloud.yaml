services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      panel:
        condition: service_healthy
    environment:
      OBS_REMOTE_DOMAIN: ${OBS_REMOTE_DOMAIN:?Set OBS_REMOTE_DOMAIN}
      OBS_REMOTE_USER: ${OBS_REMOTE_USER:?Set OBS_REMOTE_USER}
      OBS_REMOTE_PASSWORD_HASH: ${OBS_REMOTE_PASSWORD_HASH:?Set OBS_REMOTE_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
